[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hma-ssy-sediment-hydropower"
version = "1.0.0"
description = "Core SSY training and historical reservoir sediment and hydropower reference workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Rui Deng"}]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.12.0",
  "scikit-learn==1.5.2",
  "xgboost==2.1.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.urls]
Repository = "https://github.com/Dr-jf/HMA-SSY-Sediment-Hydropower"
Issues = "https://github.com/Dr-jf/HMA-SSY-Sediment-Hydropower/issues"

[tool.setuptools.packages.find]
include = ["hma_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
